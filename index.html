<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abrir CalenGoo</title>
</head>
<body style="font-family:sans-serif;text-align:center;padding:32px 16px">
<p>Abriendo CalenGoo...</p>
<!-- Si no salta solo, este botón abre la app directo -->
<a id="abrir" href="intent://#Intent;package=com.calengoo.android;end" style="display:inline-block;padding:10px 20px;border-radius:20px;background:#1A73E8;color:#fff;text-decoration:none">Abrir CalenGoo</a>
<!-- Respaldo: el servidor de Tasker que abre CalenGoo -->
<p><a href="http://127.0.0.1:1821/calengoo" style="color:#1A73E8">Abrir con Tasker</a></p>
<script>
  // 1. Intenta abrir la app directo (así la pestaña se cierra sola, como con Word)
  location.href = document.getElementById('abrir').href;
  // 2. Si en 2 segundos la página sigue a la vista, la app no abrió: usa Tasker
  setTimeout(function () {
    if (!document.hidden) location.replace('http://127.0.0.1:1821/calengoo');
  }, 2000);
</script>
</body>
</html>
