<body style="font-family:sans-serif;text-align:center;padding:32px 16px">
<p>Corriendo "Revisar alarma" en Tasker...</p>
<!-- Si no salta solo, este botón llama a Tasker con un toque -->
<a id="tasker" href="http://127.0.0.1:1821/alarma" style="display:inline-block;padding:10px 20px;border-radius:20px;background:#1A73E8;color:#fff;text-decoration:none">Revisar alarma</a>
<script>
  // Llama al servidor de Tasker del cel (puerto 1821, ruta /alarma), que corre la tarea "Revisar alarma".
  // La página del ReviPlan no puede abrir links http://127.0.0.1 directo; por eso pasa por este puente https.
  location.replace(document.getElementById('tasker').href);
</script>
</body>
